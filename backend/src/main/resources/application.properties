# ==========================================
# Application Configuration
# ==========================================
spring.application.name=ehr-backend
server.port=${PORT:8080}

# ==========================================
# PostgreSQL Database Configuration (Supabase)
# Set these as Environment Variables in your hosting provider
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS config (set to your production frontend URL in hosting environment)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================================
# Razorpay Configuration
# ==========================================
razorpay.api.key=${RAZORPAY_KEY}
razorpay.api.secret=${RAZORPAY_SECRET}
